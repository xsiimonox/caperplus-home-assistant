substitutions:
  name: esp-caperplus-q2
  friendly_name: CaperPlus Q2

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: CaperPlus Q2 pH, TDS and temperature monitor

esp8266:
  board: d1_mini

# GPIO3 is the hardware RX line connected to the Q2 measuring controller.
# Disable serial logging so it cannot interfere with that data stream.
logger:
  baud_rate: 0

api:
  encryption:
    key: !secret caperplus_api_key

ota:
  - platform: esphome
    password: !secret caperplus_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: CaperPlus-Q2-Setup
    password: !secret caperplus_fallback_password

captive_portal:

uart:
  id: caperplus_uart
  rx_pin: GPIO3
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

sensor:
  - platform: template
    id: caperplus_temperature
    name: Wassertemperatur
    device_class: temperature
    state_class: measurement
    unit_of_measurement: °C
    accuracy_decimals: 1

  - platform: template
    id: caperplus_ph
    name: pH
    state_class: measurement
    unit_of_measurement: pH
    icon: mdi:ph
    accuracy_decimals: 2

  - platform: template
    id: caperplus_tds
    name: TDS
    state_class: measurement
    unit_of_measurement: ppm
    icon: mdi:water
    accuracy_decimals: 0

interval:
  - interval: 500ms
    then:
      - lambda: |-
          // The Q2 continuously sends 62-byte UART frames:
          // FF FF 00 3A ... pH[49:50], TDS[53:54], temperature[55:56].
          static uint8_t frame[62];
          static uint8_t position = 0;
          uint8_t byte;

          while (id(caperplus_uart).available()) {
            if (!id(caperplus_uart).read_byte(&byte)) {
              break;
            }

            // Synchronise with the four-byte frame header.
            if (position == 0 && byte != 0xFF) {
              continue;
            }
            if (position == 1 && byte != 0xFF) {
              position = (byte == 0xFF) ? 1 : 0;
              continue;
            }
            if (position == 2 && byte != 0x00) {
              position = (byte == 0xFF) ? 1 : 0;
              continue;
            }
            if (position == 3 && byte != 0x3A) {
              position = (byte == 0xFF) ? 1 : 0;
              continue;
            }

            frame[position++] = byte;
            if (position != sizeof(frame)) {
              continue;
            }

            const float ph = ((frame[49] << 8) | frame[50]) / 100.0f;
            const uint16_t tds = (frame[53] << 8) | frame[54];
            const float temperature = ((frame[55] << 8) | frame[56]) / 100.0f;

            // Reject corrupt or incomplete data before publishing it.
            if (ph >= 0.0f && ph <= 14.0f && temperature >= -10.0f && temperature <= 100.0f) {
              id(caperplus_ph).publish_state(ph);
              id(caperplus_tds).publish_state(tds);
              id(caperplus_temperature).publish_state(temperature);
            }
            position = 0;
          }
