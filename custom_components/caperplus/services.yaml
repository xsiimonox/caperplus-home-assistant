calibrate_ph:
  name: pH-Sonde kalibrieren
  description: Startet die Einpunktkalibrierung des ausgewählten CaperPlus Q2 mit einem Puffer.
  fields:
    device_id:
      name: Gerät
      description: CaperPlus Q2, dessen Sonde im gewählten Puffer steht.
      required: true
      selector:
        device:
          integration: caperplus
    target_ph:
      name: Puffer pH
      description: Aufgedruckter pH-Wert der Kalibrierlösung bei der aktuellen Lösungstemperatur.
      required: true
      selector:
        select:
          options:
            - label: "4.00"
              value: "4.00"
            - label: "6.86"
              value: "6.86"
            - label: "7.00"
              value: "7.00"
            - label: "9.18"
              value: "9.18"
            - label: "9.21"
              value: "9.21"
            - label: "10.00"
              value: "10.00"
